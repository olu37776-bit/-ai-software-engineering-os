name: M0 remediation PR executor

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

jobs:
  remediate:
    if: "${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'remediation/m0-governance-hardening' }}"
    permissions:
      contents: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      final_commit: ${{ steps.subject.outputs.final_commit }}
    steps:
      - name: Clone remediation branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          git clone --branch "${HEAD_REF}" --single-branch "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Materialize and execute remediation when bootstrap is requested
        working-directory: repo
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          current_message="$(git log -1 --pretty=%s)"
          if [ "${current_message}" = "chore: bootstrap M0 remediation" ]; then
            cat .github/m0-bootstrap/*.txt | tr -d '\n' | base64 --decode | xz --decompress --stdout > /tmp/m0-files.json
            python -c 'import json,pathlib; d=json.load(open("/tmp/m0-files.json",encoding="utf-8")); [(lambda p,c:(p.parent.mkdir(parents=True,exist_ok=True),p.write_text(c,encoding="utf-8",newline="\n")))(pathlib.Path(k),v) for k,v in d.items()]'
            python -m py_compile scripts/m0/bootstrap_remediation.py scripts/m0/verify_preimplementation.py
            python -m pip install --disable-pip-version-check --no-input \
              "jsonschema==4.25.1" \
              "referencing==0.36.2"
            python scripts/m0/bootstrap_remediation.py
            python scripts/m0/verify_preimplementation.py \
              --mode implementation \
              --output operations/phase-1/evidence/m0-implementation-verification.json
            git add -A
            git diff --cached --check
            git commit -m "fix: harden M0 contract and Phase 1 governance baseline"
            implementation_commit="$(git rev-parse HEAD)"
            python scripts/m0/bootstrap_remediation.py --finalize-receipt "${implementation_commit}"
            git add operations/phase-1/remediation-receipt.json
            git diff --cached --check
            git commit -m "chore: record M0 remediation receipt"
            python scripts/m0/verify_preimplementation.py --mode implementation
            test -z "$(git status --porcelain)"
            git push origin "HEAD:${HEAD_REF}"
          fi

      - name: Identify immutable subject commit
        id: subject
        working-directory: repo
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.head.ref }}"
          final_commit="$(git rev-parse FETCH_HEAD)"
          echo "final_commit=${final_commit}" >> "$GITHUB_OUTPUT"
          echo "Final subject: ${final_commit}"

  independent-verification:
    needs: remediate
    if: "${{ needs.remediate.result == 'success' }}"
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone immutable remediation subject
        env:
          GH_TOKEN: ${{ github.token }}
          SUBJECT_COMMIT: ${{ needs.remediate.outputs.final_commit }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "${SUBJECT_COMMIT}"

      - name: Install pinned verifier dependencies
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            "jsonschema==4.25.1" \
            "referencing==0.36.2"

      - name: Execute read-only independent verification
        working-directory: repo
        run: |
          set -euo pipefail
          python scripts/m0/verify_preimplementation.py \
            --mode independent \
            --output m0-independent-preimplementation-report.json
          test -z "$(git status --porcelain --untracked-files=no)"
          cat m0-independent-preimplementation-report.json

      - name: Publish verification summary
        working-directory: repo
        env:
          SUMMARY_FILE: ${{ github.step_summary }}
        run: |
          python -c 'import json,os,pathlib; r=json.loads(pathlib.Path("m0-independent-preimplementation-report.json").read_text()); s="# M0 Independent Preimplementation Verification\n\n- Decision: **{}**\n- Subject commit: `{}`\n- Subject tree: `{}`\n- Required checks: {}\n".format(r["decision"],r["subjectCommit"],r["subjectTree"],len(r["checks"])); pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a",encoding="utf-8").write(s)'
