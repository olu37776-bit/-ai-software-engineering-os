name: M0 independent preimplementation verification

on:
  push:
    branches:
      - remediation/m0-governance-hardening
    paths:
      - packages/contracts/**
      - operations/phase-1/**
      - docs/**
      - scripts/m0/verify_preimplementation.py
      - scripts/m0/bootstrap_remediation.py
      - .github/workflows/m0-remediate.yml
      - .github/m0-bootstrap/**

permissions:
  contents: read

concurrency:
  group: m0-independent-preimplementation-verification
  cancel-in-progress: false

jobs:
  verify:
    if: "${{ github.event.head_commit.message == 'chore: record M0 remediation receipt' || github.event.head_commit.message == 'chore: remove M0 bootstrap assets' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone exact immutable subject commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "${GITHUB_SHA}"

      - name: Install pinned verifier dependencies
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            "jsonschema==4.25.1" \
            "referencing==0.36.2"

      - name: Execute read-only independent verification
        working-directory: repo
        run: |
          set -euo pipefail
          python scripts/m0/verify_preimplementation.py \
            --mode independent \
            --output m0-independent-preimplementation-report.json
          test -z "$(git status --porcelain --untracked-files=no)"
          cat m0-independent-preimplementation-report.json

      - name: Publish concise job summary
        working-directory: repo
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("m0-independent-preimplementation-report.json").read_text())
          print("# M0 Independent Preimplementation Verification")
          print()
          print(f"- Decision: **{report['decision']}**")
          print(f"- Subject commit: `{report['subjectCommit']}`")
          print(f"- Subject tree: `{report['subjectTree']}`")
          print(f"- Required checks: {len(report['checks'])}")
          PY
