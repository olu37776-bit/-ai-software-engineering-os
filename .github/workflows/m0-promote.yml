name: M0 independent preimplementation verification and promotion

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/m0-promote.yml

permissions:
  contents: write

concurrency:
  group: m0-promotion
  cancel-in-progress: false

jobs:
  verify-and-promote:
    if: github.event.head_commit.message == 'chore: run M0 promotion'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Clone repository without third-party actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Install pinned independent verifier
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1" "referencing==0.36.2"

      - name: Reconstruct immutable remediation tree, verify twice, submit M0 Gate, and open Phase 1
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TREE: c0f62eca141e898374bcb71d4864a70431ad8804
          PHASE_BRANCH: phase-1/p1-o01-toolchain-foundation
        working-directory: repo
        run: |
          set -euo pipefail
          cat > /tmp/m0_promote.py <<'PY'
          from __future__ import annotations

          import base64
          import copy
          import datetime as dt
          import fnmatch
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat
          import subprocess
          import sys
          import urllib.request
          from collections import defaultdict, deque
          from typing import Any, Iterable

          from jsonschema import Draft202012Validator
          from referencing import Registry, Resource

          ROOT = pathlib.Path.cwd()
          REPO = os.environ["GITHUB_REPOSITORY"]
          TOKEN = os.environ["GH_TOKEN"]
          TARGET_TREE = os.environ["TARGET_TREE"]
          PHASE_BRANCH = os.environ["PHASE_BRANCH"]
          NOW = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          API = f"https://api.github.com/repos/{REPO}"

          def run(*args: str, capture: bool = True) -> str:
              result = subprocess.run(args, cwd=ROOT, text=True, check=True,
                                      stdout=subprocess.PIPE if capture else None,
                                      stderr=subprocess.STDOUT if capture else None)
              return result.stdout.strip() if capture else ""

          def api_json(path: str) -> Any:
              req = urllib.request.Request(
                  API + path,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {TOKEN}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "aseos-m0-independent-verifier",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def canonical_json(value: Any) -> bytes:
              return json.dumps(value, ensure_ascii=False, sort_keys=True,
                                separators=(",", ":"), allow_nan=False).encode("utf-8")

          def normalize_hash(value: Any) -> str | None:
              if not isinstance(value, str):
                  return None
              value = value.strip().lower()
              if value.startswith("sha256:"):
                  value = value[7:]
              return value if re.fullmatch(r"[0-9a-f]{64}", value) else None

          def reconstruct_tree() -> None:
              tree = api_json(f"/git/trees/{TARGET_TREE}?recursive=1")
              if tree.get("truncated"):
                  raise RuntimeError("Git tree response was truncated")
              blobs = {
                  item["path"]: (item["sha"], item.get("mode", "100644"))
                  for item in tree.get("tree", []) if item.get("type") == "blob"
              }
              if not blobs:
                  raise RuntimeError("Target tree contains no blobs")
              tracked = set(filter(None, run("git", "ls-files").splitlines()))
              for rel in sorted(tracked - set(blobs)):
                  path = ROOT / rel
                  if path.exists() or path.is_symlink():
                      path.unlink()
              for rel, (blob_sha, mode) in blobs.items():
                  payload = api_json(f"/git/blobs/{blob_sha}")
                  if payload.get("encoding") != "base64":
                      raise RuntimeError(f"Unsupported blob encoding for {rel}")
                  data = base64.b64decode(payload["content"])
                  path = ROOT / rel
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(data)
                  current = path.stat().st_mode
                  if mode == "100755":
                      path.chmod(current | stat.S_IXUSR | stat.S_IXGRP | stat.S_IXOTH)
                  else:
                      path.chmod(current & ~stat.S_IXUSR & ~stat.S_IXGRP & ~stat.S_IXOTH)
              run("git", "add", "-A", capture=False)
              staged_tree = run("git", "write-tree")
              if staged_tree != TARGET_TREE:
                  raise RuntimeError(f"Reconstructed tree mismatch: {staged_tree} != {TARGET_TREE}")

          def all_json_files() -> list[pathlib.Path]:
              roots = [ROOT / "packages" / "contracts", ROOT / "operations" / "phase-1"]
              result: list[pathlib.Path] = []
              for base in roots:
                  if base.exists():
                      result.extend(p for p in base.rglob("*.json") if p.is_file())
              return sorted(set(result))

          def load_json(path: pathlib.Path) -> Any:
              return json.loads(path.read_text(encoding="utf-8"))

          def walk(value: Any) -> Iterable[Any]:
              yield value
              if isinstance(value, dict):
                  for item in value.values():
                      yield from walk(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from walk(item)

          def walk_dicts(value: Any) -> Iterable[dict[str, Any]]:
              for item in walk(value):
                  if isinstance(item, dict):
                      yield item

          def json_pointer(document: Any, pointer: str) -> Any:
              if pointer in ("", "#"):
                  return document
              if pointer.startswith("#"):
                  pointer = pointer[1:]
              if not pointer.startswith("/"):
                  raise KeyError(pointer)
              value = document
              for token in pointer[1:].split("/"):
                  token = token.replace("~1", "/").replace("~0", "~")
                  value = value[int(token)] if isinstance(value, list) else value[token]
              return value

          def find_refs(value: Any) -> Iterable[str]:
              if isinstance(value, dict):
                  ref = value.get("$ref")
                  if isinstance(ref, str):
                      yield ref
                  for item in value.values():
                      yield from find_refs(item)
              elif isinstance(value, list):
                  for item in value:
                      yield from find_refs(item)

          def check_dag(ids: set[str], deps: dict[str, list[str]], label: str) -> None:
              unknown = sorted({d for values in deps.values() for d in values if d not in ids})
              if unknown:
                  raise AssertionError(f"{label} has unknown dependencies: {unknown}")
              indegree = {item: 0 for item in ids}
              outgoing: dict[str, list[str]] = defaultdict(list)
              for item, values in deps.items():
                  for dep in values:
                      indegree[item] += 1
                      outgoing[dep].append(item)
              queue = deque(sorted(item for item, n in indegree.items() if n == 0))
              seen: list[str] = []
              while queue:
                  item = queue.popleft()
                  seen.append(item)
                  for nxt in outgoing[item]:
                      indegree[nxt] -= 1
                      if indegree[nxt] == 0:
                          queue.append(nxt)
              if len(seen) != len(ids):
                  raise AssertionError(f"{label} contains a cycle")

          def dict_id(item: dict[str, Any], prefixes: tuple[str, ...]) -> str | None:
              for key in ("operationId", "verificationStepId", "stepId", "id"):
                  value = item.get(key)
                  if isinstance(value, str) and value.startswith(prefixes):
                      return value
              return None

          def dependencies(item: dict[str, Any]) -> list[str]:
              for key in ("dependsOn", "dependencies", "requires", "prerequisites"):
                  value = item.get(key)
                  if isinstance(value, list):
                      return [v for v in value if isinstance(v, str)]
              return []

          def extract_cases(suite: Any, suite_path: pathlib.Path) -> list[dict[str, Any]]:
              cases: list[dict[str, Any]] = []
              for item in walk_dicts(suite):
                  schema_ref = item.get("schemaId") or item.get("schema") or item.get("schemaRef")
                  expected = item.get("expectedValid")
                  if expected is None and isinstance(item.get("valid"), bool):
                      expected = item["valid"]
                  if expected is None and isinstance(item.get("expected"), str):
                      expected = item["expected"].upper() in {"VALID", "PASS", "ACCEPT"}
                  has_instance = any(k in item for k in ("instance", "data", "value", "document", "payload",
                                                          "examplePath", "instancePath", "path", "file"))
                  if schema_ref is not None and isinstance(expected, bool) and has_instance:
                      case = dict(item)
                      case["__schema_ref"] = schema_ref
                      case["__expected"] = expected
                      case["__suite_path"] = suite_path
                      cases.append(case)
              return cases

          def case_instance(case: dict[str, Any]) -> Any:
              for key in ("instance", "data", "value", "document", "payload"):
                  if key in case:
                      return case[key]
              for key in ("examplePath", "instancePath", "path", "file"):
                  value = case.get(key)
                  if isinstance(value, str):
                      candidate = ROOT / value
                      if not candidate.exists():
                          candidate = case["__suite_path"].parent / value
                      return load_json(candidate.resolve())
              raise AssertionError("Example case has no readable instance")

          def schema_ref_value(value: Any) -> str | None:
              if isinstance(value, str):
                  return value
              if isinstance(value, dict):
                  for key in ("schemaId", "$id", "id", "ref"):
                      if isinstance(value.get(key), str):
                          return value[key]
              return None

          def pattern_covers(parent: str, child: str) -> bool:
              if parent == child:
                  return True
              if parent.endswith("/**"):
                  prefix = parent[:-3].rstrip("/")
                  child_prefix = child[:-3].rstrip("/") if child.endswith("/**") else child
                  return child_prefix == prefix or child_prefix.startswith(prefix + "/")
              if any(ch in parent for ch in "*?["):
                  sample = child.replace("/**", "/__probe__").replace("*", "__probe__")
                  return fnmatch.fnmatch(sample, parent)
              return False

          def gather_string_lists(value: Any, keys: set[str]) -> list[list[str]]:
              result: list[list[str]] = []
              if isinstance(value, dict):
                  for key, item in value.items():
                      if key in keys and isinstance(item, list) and all(isinstance(v, str) for v in item):
                          result.append(item)
                      result.extend(gather_string_lists(item, keys))
              elif isinstance(value, list):
                  for item in value:
                      result.extend(gather_string_lists(item, keys))
              return result

          def set_first_status(value: Any, id_prefix: str, bad: str) -> bool:
              for item in walk_dicts(value):
                  ident = dict_id(item, (id_prefix,))
                  if ident:
                      for key in ("status", "result", "outcome", "decision"):
                          if key in item and isinstance(item[key], str):
                              item[key] = bad
                              return True
              return False

          def mutate_first_key(value: Any, keys: tuple[str, ...], new_value: Any) -> bool:
              for item in walk_dicts(value):
                  for key in keys:
                      if key in item:
                          item[key] = new_value
                          return True
              return False

          def verify(subject: str) -> dict[str, Any]:
              checks: list[dict[str, Any]] = []
              evidence: dict[str, Any] = {}

              def check(name: str, fn) -> Any:
                  try:
                      detail = fn()
                      checks.append({"id": name, "result": "PASS", "detail": detail})
                      return detail
                  except Exception as exc:
                      checks.append({"id": name, "result": "FAIL", "detail": f"{type(exc).__name__}: {exc}"})
                      raise

              json_files = all_json_files()
              documents: dict[pathlib.Path, Any] = {}
              check("V01_JSON_PARSE", lambda: [documents.setdefault(p, load_json(p)) or str(p.relative_to(ROOT)) for p in json_files])

              schema_paths = sorted(p for p in json_files if p.name.endswith(".schema.json"))
              schemas = {p: documents[p] for p in schema_paths}
              check("V02_SCHEMA_COUNT", lambda: (_ for _ in ()).throw(AssertionError(f"expected >=15 schemas, got {len(schemas)}")) if len(schemas) < 15 else len(schemas))
              check("V03_SCHEMA_META_VALID", lambda: [Draft202012Validator.check_schema(s) for s in schemas.values()] or len(schemas))

              id_to_path: dict[str, pathlib.Path] = {}
              for path, schema in schemas.items():
                  sid = schema.get("$id")
                  if not isinstance(sid, str) or not sid:
                      raise AssertionError(f"Schema lacks $id: {path.relative_to(ROOT)}")
                  if sid in id_to_path:
                      raise AssertionError(f"Duplicate $id: {sid}")
                  id_to_path[sid] = path
              check("V04_SCHEMA_ID_UNIQUENESS", lambda: len(id_to_path))

              registry = Registry()
              for sid, path in id_to_path.items():
                  registry = registry.with_resource(sid, Resource.from_contents(schemas[path]))

              def refs_check() -> int:
                  count = 0
                  for path, schema in schemas.items():
                      base_id = schema["$id"]
                      for ref in find_refs(schema):
                          count += 1
                          if ref.startswith("#"):
                              json_pointer(schema, ref)
                              continue
                          target, _, fragment = ref.partition("#")
                          candidates = [target]
                          if target.startswith("./") or target.startswith("../"):
                              candidate_path = (path.parent / target).resolve()
                              if not candidate_path.exists():
                                  raise AssertionError(f"Unresolved relative $ref {ref} in {path}")
                              target_schema = load_json(candidate_path)
                          elif target in id_to_path:
                              target_schema = schemas[id_to_path[target]]
                          else:
                              matched = [p for sid, p in id_to_path.items() if sid.rstrip("/") + "/" + target.lstrip("/") in id_to_path]
                              if matched:
                                  target_schema = schemas[matched[0]]
                              else:
                                  raise AssertionError(f"Unresolved $ref {ref} in {path.relative_to(ROOT)}")
                          if fragment:
                              json_pointer(target_schema, "#" + fragment)
                  return count
              check("V05_REF_RESOLUTION", refs_check)

              inventory_path = ROOT / "packages/contracts/schema-inventory.json"
              planned_path = ROOT / "packages/contracts/planned-contracts.json"
              inventory = documents[inventory_path]
              planned = documents[planned_path]

              authority_entries = [d for d in walk_dicts(inventory) if any(k in d for k in ("authorityPath", "schemaPath"))]
              def inventory_paths() -> int:
                  if not authority_entries:
                      raise AssertionError("No schema inventory authority entries")
                  for entry in authority_entries:
                      rel = entry.get("authorityPath") or entry.get("schemaPath")
                      if not isinstance(rel, str) or not (ROOT / rel).is_file():
                          raise AssertionError(f"Missing authority path: {rel}")
                      sid = entry.get("schemaId") or entry.get("$id")
                      if sid and sid not in id_to_path:
                          raise AssertionError(f"Inventory schemaId not found: {sid}")
                  return len(authority_entries)
              check("V06_INVENTORY_AUTHORITY_PATHS", inventory_paths)

              def inventory_hashes() -> int:
                  verified = 0
                  for entry in authority_entries:
                      rel = entry.get("authorityPath") or entry.get("schemaPath")
                      expected = normalize_hash(entry.get("sha256") or entry.get("contentHash") or entry.get("schemaHash"))
                      if expected:
                          path = ROOT / rel
                          raw = sha256(path.read_bytes())
                          canonical = sha256(canonical_json(load_json(path)))
                          if expected not in {raw, canonical}:
                              raise AssertionError(f"Hash mismatch: {rel}")
                          verified += 1
                  if verified == 0:
                      raise AssertionError("Inventory contains no verifiable hashes")
                  return verified
              check("V07_INVENTORY_HASHES", inventory_hashes)

              planned_entries = [d for d in walk_dicts(planned) if any(k in d for k in ("authorityPath", "schemaPath", "plannedPath"))]
              def planned_paths() -> int:
                  if not planned_entries:
                      raise AssertionError("No planned contract entries")
                  for entry in planned_entries:
                      rel = entry.get("authorityPath") or entry.get("schemaPath") or entry.get("plannedPath")
                      if isinstance(rel, str) and not (ROOT / rel).exists():
                          raise AssertionError(f"Planned authority path does not exist: {rel}")
                  return len(planned_entries)
              check("V08_PLANNED_CONTRACT_PATHS", planned_paths)

              suite_paths = sorted((ROOT / "packages/contracts/examples").rglob("*suite*.json"))
              if not suite_paths:
                  suite_paths = sorted((ROOT / "packages/contracts/examples").rglob("*.json"))
              cases: list[dict[str, Any]] = []
              for path in suite_paths:
                  cases.extend(extract_cases(load_json(path), path))
              check("V09_EXAMPLE_CASE_DISCOVERY", lambda: (_ for _ in ()).throw(AssertionError(f"expected >=30 example cases, got {len(cases)}")) if len(cases) < 30 else len(cases))

              coverage: dict[str, set[bool]] = defaultdict(set)
              valid_instances: list[tuple[str, Any]] = []
              invalid_count = 0
              valid_count = 0
              def examples_validate() -> dict[str, int]:
                  nonlocal valid_count, invalid_count
                  for case in cases:
                      sid = schema_ref_value(case["__schema_ref"])
                      if sid not in id_to_path:
                          raise AssertionError(f"Example references unknown schema: {sid}")
                      instance = case_instance(case)
                      errors = list(Draft202012Validator(schemas[id_to_path[sid]], registry=registry).iter_errors(instance))
                      expected = case["__expected"]
                      if expected and errors:
                          raise AssertionError(f"Valid example failed {sid}: {errors[0].message}")
                      if not expected and not errors:
                          raise AssertionError(f"Invalid example unexpectedly passed {sid}")
                      coverage[sid].add(expected)
                      if expected:
                          valid_count += 1
                          valid_instances.append((sid, instance))
                      else:
                          invalid_count += 1
                  return {"valid": valid_count, "invalid": invalid_count}
              check("V10_VALID_AND_INVALID_EXAMPLES", examples_validate)
              check("V11_PER_SCHEMA_EXAMPLE_COVERAGE", lambda: (_ for _ in ()).throw(AssertionError(f"Schemas without valid+invalid examples: {[sid for sid in id_to_path if coverage[sid] != {False, True}]}")) if any(coverage[sid] != {False, True} for sid in id_to_path) else len(id_to_path))
              check("V12_EXAMPLE_SCHEMA_ID_RESOLUTION", lambda: len({schema_ref_value(c["__schema_ref"]) for c in cases}))

              def hash_fidelity() -> dict[str, int]:
                  counts = {"payloadHash": 0, "schemaHash": 0, "artifactHash": 0}
                  for sid, instance in valid_instances:
                      for item in walk_dicts(instance):
                          if "payloadHash" in item and "payload" in item:
                              expected = normalize_hash(item["payloadHash"])
                              actual = sha256(canonical_json(item["payload"]))
                              if expected != actual:
                                  raise AssertionError(f"payloadHash mismatch in {sid}")
                              counts["payloadHash"] += 1
                          if "schemaHash" in item:
                              expected = normalize_hash(item["schemaHash"])
                              ref = schema_ref_value(item.get("payloadSchema") or item.get("schemaRef") or item.get("schemaId"))
                              if expected and ref in id_to_path:
                                  path = id_to_path[ref]
                                  actuals = {sha256(path.read_bytes()), sha256(canonical_json(schemas[path]))}
                                  if expected not in actuals:
                                      raise AssertionError(f"schemaHash mismatch in {sid}")
                                  counts["schemaHash"] += 1
                          for key in ("contentHash", "artifactHash"):
                              if key in item:
                                  expected = normalize_hash(item[key])
                                  inline = item.get("inlineValue") if "inlineValue" in item else item.get("content")
                                  if expected and inline is not None:
                                      raw = inline.encode("utf-8") if isinstance(inline, str) else canonical_json(inline)
                                      if expected != sha256(raw):
                                          raise AssertionError(f"{key} mismatch in {sid}")
                                      counts["artifactHash"] += 1
                                  elif expected and isinstance(item.get("contentRef"), str):
                                      path = ROOT / item["contentRef"]
                                      if path.is_file():
                                          if expected != sha256(path.read_bytes()):
                                              raise AssertionError(f"{key} mismatch for {path}")
                                          counts["artifactHash"] += 1
                  if counts["payloadHash"] < 1 or counts["schemaHash"] < 1 or counts["artifactHash"] < 1:
                      raise AssertionError(f"Insufficient real hash fixtures: {counts}")
                  return counts
              check("V13_HASH_FIDELITY", hash_fidelity)

              def no_placeholders() -> int:
                  count = 0
                  repeated = re.compile(r"(?i)(?:sha256:)?([0-9a-f])\1{63}")
                  for path in json_files:
                      text = path.read_text(encoding="utf-8")
                      if repeated.search(text) or re.search(r"(?i)TODO_HASH|PLACEHOLDER_HASH|deadbeef(?:deadbeef)+", text):
                          raise AssertionError(f"Placeholder hash in {path.relative_to(ROOT)}")
                      count += 1
                  return count
              check("V14_NO_PLACEHOLDER_HASHES", no_placeholders)

              operation_path = ROOT / "operations/phase-1/operation.json"
              write_scope_path = ROOT / "operations/phase-1/write-scope.json"
              verification_path = ROOT / "operations/phase-1/verification-plan.json"
              operation = documents[operation_path]
              write_scope = documents[write_scope_path]
              verification = documents[verification_path]

              op_items = {dict_id(d, ("P1-O",)): d for d in walk_dicts(operation) if dict_id(d, ("P1-O",))}
              expected_ops = {f"P1-O{i:02d}" for i in range(1, 10)}
              check("V15_OPERATION_SET", lambda: (_ for _ in ()).throw(AssertionError(f"operation set mismatch: {set(op_items)}")) if set(op_items) != expected_ops else len(op_items))
              op_deps = {oid: dependencies(item) for oid, item in op_items.items()}
              check("V16_OPERATION_DAG", lambda: check_dag(set(op_items), op_deps, "Operation DAG") or op_deps)

              ver_items = {dict_id(d, ("P1-V", "V")): d for d in walk_dicts(verification) if dict_id(d, ("P1-V", "V"))}
              if not ver_items:
                  raise AssertionError("No VerificationPlan steps found")
              ver_deps = {vid: dependencies(item) for vid, item in ver_items.items()}
              check("V17_VERIFICATION_DAG", lambda: check_dag(set(ver_items), ver_deps, "Verification DAG") or ver_deps)

              required_ver = {vid for vid, item in ver_items.items() if item.get("required", True) is not False}
              verification_text = json.dumps(verification, ensure_ascii=False)
              check("V18_GATE_COVERS_REQUIRED_STEPS", lambda: (_ for _ in ()).throw(AssertionError(f"Required steps absent from gate rules: {[v for v in required_ver if verification_text.count(v) < 2]}")) if any(verification_text.count(v) < 2 for v in required_ver) else len(required_ver))

              global_lists = gather_string_lists(write_scope, {"allowedWritePaths", "globalAllowedWritePaths", "writeAllowlist", "globalAllowlist"})
              if not global_lists:
                  raise AssertionError("No global write allowlist")
              global_paths = max(global_lists, key=len)
              def scope_global() -> int:
                  required = {"tests/fault-injection/**", "tests/security/**"}
                  missing = [p for p in required if not any(pattern_covers(g, p) for g in global_paths)]
                  if missing:
                      raise AssertionError(f"Global allowlist missing: {missing}")
                  return len(global_paths)
              check("V19_GLOBAL_WRITE_SCOPE_COMPLETENESS", scope_global)

              op_scopes: dict[str, list[str]] = {}
              for item in walk_dicts(write_scope):
                  oid = dict_id(item, ("P1-O",))
                  if not oid:
                      continue
                  lists = gather_string_lists(item, {"allowedWritePaths", "writePaths", "allow", "writeAllowlist"})
                  if lists:
                      op_scopes[oid] = max(lists, key=len)
              def scope_subset() -> int:
                  missing = expected_ops - set(op_scopes)
                  if missing:
                      raise AssertionError(f"Operations missing write scope: {sorted(missing)}")
                  for oid, patterns in op_scopes.items():
                      for pattern in patterns:
                          if not any(pattern_covers(parent, pattern) for parent in global_paths):
                              raise AssertionError(f"{oid} path outside global scope: {pattern}")
                  return sum(map(len, op_scopes.values()))
              check("V20_OPERATION_SCOPE_SUBSET", scope_subset)

              authority_files = {
                  "operations/phase-1/operation.json",
                  "operations/phase-1/write-scope.json",
                  "operations/phase-1/verification-plan.json",
                  "docs/roadmap/phase-1-operation-plan.md",
                  "docs/roadmap/phase-1-write-scope.md",
                  "docs/roadmap/phase-1-verification-plan.md",
              }
              lock_lists = gather_string_lists(write_scope, {"authorityLock", "lockedPaths", "readOnlyPaths", "immutablePaths"})
              def authority_lock() -> dict[str, Any]:
                  locked = set(v for values in lock_lists for v in values)
                  if not lock_lists:
                      raise AssertionError("No explicit authority lock")
                  for path in authority_files:
                      if not any(pattern_covers(lock, path) for lock in locked):
                          raise AssertionError(f"Authority file not locked: {path}")
                  for oid, patterns in op_scopes.items():
                      for pattern in patterns:
                          if pattern in {"operations/phase-1/**", "docs/roadmap/**"}:
                              raise AssertionError(f"Overbroad governing-path write scope in {oid}: {pattern}")
                          for authority in authority_files:
                              if pattern_covers(pattern, authority):
                                  raise AssertionError(f"{oid} can mutate authority file {authority} via {pattern}")
                  return {"locked": sorted(locked), "authorityFiles": sorted(authority_files)}
              check("V21_AUTHORITY_LOCK", authority_lock)

              receipt_candidates = [p for p in schema_paths if "receipt" in p.name.lower()]
              if not receipt_candidates:
                  raise AssertionError("Implementation receipt schema not found")
              receipt_path = receipt_candidates[0]
              receipt_schema = schemas[receipt_path]
              receipt_id = receipt_schema["$id"]
              receipt_validator = Draft202012Validator(receipt_schema, registry=registry)
              receipt_valids = [inst for sid, inst in valid_instances if sid == receipt_id]
              if not receipt_valids:
                  raise AssertionError("No valid receipt fixture")
              receipt_base = copy.deepcopy(receipt_valids[0])
              check("V22_RECEIPT_POSITIVE", lambda: (_ for _ in ()).throw(AssertionError(next(receipt_validator.iter_errors(receipt_base)).message)) if not receipt_validator.is_valid(receipt_base) else "valid IMPLEMENTED receipt accepted")

              def receipt_negative_matrix() -> list[str]:
                  mutations: list[tuple[str, Any]] = []
                  a = copy.deepcopy(receipt_base)
                  if set_first_status(a, "P1-O", "NOT_STARTED"):
                      mutations.append(("incomplete-operation", a))
                  b = copy.deepcopy(receipt_base)
                  if set_first_status(b, "P1-V", "FAIL") or set_first_status(b, "V", "FAIL"):
                      mutations.append(("failed-verification", b))
                  c = copy.deepcopy(receipt_base)
                  if mutate_first_key(c, ("overallResult", "overallDecision", "gateDecision", "result"), "FAIL"):
                      mutations.append(("overall-fail", c))
                  d = copy.deepcopy(receipt_base)
                  if mutate_first_key(d, ("scopeViolations", "writeScopeViolations"), ["unauthorized/path"]):
                      mutations.append(("scope-violation", d))
                  e = copy.deepcopy(receipt_base)
                  if mutate_first_key(e, ("stopConditionTriggered", "stopConditionActive"), True):
                      mutations.append(("stop-condition", e))
                  if len(mutations) < 4:
                      raise AssertionError(f"Receipt fixture lacks fields for negative matrix: {[m[0] for m in mutations]}")
                  accepted = [name for name, instance in mutations if receipt_validator.is_valid(instance)]
                  if accepted:
                      raise AssertionError(f"Receipt schema accepted forbidden IMPLEMENTED states: {accepted}")
                  return [name for name, _ in mutations]
              check("V23_RECEIPT_STATUS_CONSTRAINTS", receipt_negative_matrix)

              docs = "\n".join((ROOT / path).read_text(encoding="utf-8") for path in (
                  "docs/roadmap/phase-1-operation-plan.md",
                  "docs/roadmap/phase-1-write-scope.md",
                  "docs/roadmap/phase-1-verification-plan.md",
              ))
              check("V24_DOC_OPERATION_COVERAGE", lambda: (_ for _ in ()).throw(AssertionError(f"Operation IDs missing in docs: {[o for o in expected_ops if o not in docs]}")) if any(o not in docs for o in expected_ops) else len(expected_ops))

              def no_fallback() -> int:
                  combined = "\n".join(p.read_text(encoding="utf-8") for p in (
                      operation_path, write_scope_path, verification_path,
                      ROOT / "docs/roadmap/phase-1-operation-plan.md",
                  ))
                  required_phrases = ("no fallback", "禁止", "superseding ADR", "STOP")
                  hits = sum(1 for phrase in required_phrases if phrase.lower() in combined.lower())
                  if hits < 2:
                      raise AssertionError("No-fallback/stop semantics not explicit enough")
                  return hits
              check("V25_NO_SILENT_FALLBACK", no_fallback)

              authority_hashes = {}
              for rel in sorted(authority_files | {
                  "packages/contracts/schema-inventory.json",
                  "packages/contracts/planned-contracts.json",
              }):
                  path = ROOT / rel
                  if path.is_file():
                      authority_hashes[rel] = "sha256:" + sha256(path.read_bytes())

              failures = [item for item in checks if item["result"] != "PASS"]
              report = {
                  "schemaVersion": "1.0.0",
                  "reportId": "m0-preimplementation-independent-verification",
                  "subject": {"kind": "git-tree-or-commit", "ref": subject, "tree": TARGET_TREE},
                  "performedAt": NOW,
                  "verifier": {
                      "id": "m0-independent-preimplementation-verifier-v1",
                      "role": "independent-preimplementation-verification",
                      "implementationSeparation": True,
                      "runtime": {"python": sys.version.split()[0], "jsonschema": "4.25.1"},
                  },
                  "scope": [
                      "Schema inventory", "planned-contract inventory", "JSON Schema 2020-12",
                      "valid/invalid/boundary examples", "hash fidelity", "Phase 1 operation DAG",
                      "WRITE_SCOPE and Authority Lock", "VerificationPlan", "implementation receipt semantics",
                  ],
                  "checks": checks,
                  "summary": {
                      "total": len(checks),
                      "passed": len(checks) - len(failures),
                      "failed": len(failures),
                      "decision": "PASS" if not failures else "FAIL",
                  },
                  "authorityHashes": authority_hashes,
                  "limitations": [
                      "This is a document/schema/plan verification; no production runtime capability exists yet.",
                      "ADR qualification spikes remain mandatory in Phase 1.",
                      "GBrain protocol facts remain a non-blocking local-integration survey item.",
                  ],
              }
              if failures:
                  raise AssertionError(f"Independent verification failed: {failures}")
              return report

          def write_json(path: pathlib.Path, value: Any) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          def report_markdown(report: dict[str, Any], remediation_commit: str) -> str:
              rows = "\n".join(
                  f"| `{item['id']}` | `{item['result']}` | {str(item['detail']).replace('|', '\\|')[:240]} |"
                  for item in report["checks"]
              )
              return f"""# M0 实现前独立验证报告

          状态：`VERIFIED`  
          决策：`PASS`  
          日期：`{NOW}`  
