name: quality

on:
  push:
    branches:
      - main
      - "phase-1/**"
  pull_request:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact protected-main merge commit to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: qualify (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: windows-x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout exact automated-event commit
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Checkout exact protected-main qualification target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0

      - name: Checkout protected-main dispatch controller
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          path: .post-merge-controller
          fetch-depth: 1

      - name: Install exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Install pinned independent verifier dependencies
        run: python -m pip install --disable-pip-version-check --no-input "jsonschema==4.25.1" "referencing==0.36.2"

      - name: Resolve exact protected-main qualification target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          POST_MERGE_TARGET_SHA: ${{ inputs.target_sha }}
          POST_MERGE_CURRENT_MAIN_SHA: ${{ github.sha }}
          POST_MERGE_REF_NAME: ${{ github.ref_name }}
        run: |
          node .post-merge-controller/scripts/toolchain/resolve-post-merge-target.mjs > .post-merge-scope.env
          node -e 'const fs = require("node:fs"); fs.appendFileSync(process.env.GITHUB_ENV, fs.readFileSync(".post-merge-scope.env")); fs.rmSync(".post-merge-scope.env"); fs.rmSync(".post-merge-controller", { recursive: true, force: true });'

      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.24.0

      - name: Clean frozen-lockfile install
        run: pnpm install --frozen-lockfile

      - name: Verify actual toolchain versions
        run: pnpm run verify:versions

      - name: Verify operation-aware Phase 1 scope
        if: ${{ github.event_name != 'workflow_dispatch' }}
        env:
          PHASE1_SCOPE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PHASE1_SCOPE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
          PHASE1_SCOPE_EVENT: ${{ github.event_name }}
          PHASE1_SCOPE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm run verify:scope

      - name: Verify exact protected-main Phase 1 scope
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: pnpm run verify:scope

      - name: Quality baseline
        run: pnpm run quality

      - name: Clean authority rebuild
        run: |
          pnpm run clean
          pnpm run build
          pnpm run test

      - name: Emit cross-platform Evidence
        run: pnpm run evidence:ci

  p1-o01-toolchain-qualify:
    name: p1-o01-toolchain-qualify
    if: always()
    needs:
      - qualification
    runs-on: ubuntu-24.04
    steps:
      - name: Require every qualification platform
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: test "$QUALIFICATION_RESULT" = "success"
