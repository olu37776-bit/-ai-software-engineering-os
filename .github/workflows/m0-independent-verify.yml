name: M0 independent preimplementation verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m0-independent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: "${{ github.event_name != 'push' || github.event.head_commit.message != 'chore: run M0 remediation build' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone immutable subject
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "${TARGET_SHA}"

      - name: Install exact Node.js for scope authority
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Resolve exact event scope bindings
        working-directory: repo
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/toolchain/resolve-scope-event.mjs >> "${GITHUB_ENV}"

      - name: Install pinned independent verifier
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            "jsonschema==4.25.1" \
            "referencing==0.36.2"

      - name: Run read-only verification
        working-directory: repo
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BEFORE="$(git status --porcelain)"
          SCOPE_REPORT="/tmp/phase1-operation-scope-report.json"
          node scripts/toolchain/verify-scope.mjs > "${SCOPE_REPORT}"
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.result !== "PASS") process.exit(1);
          ' "${SCOPE_REPORT}"
          python scripts/governance/verify_m0.py \
            --base "${PHASE1_SCOPE_BASE}" \
            --head "${PHASE1_SCOPE_HEAD}" \
            --branch "${PHASE1_SCOPE_BRANCH}" \
            --scope-report "${SCOPE_REPORT}" \
            --subject "${TARGET_SHA}" \
            | tee /tmp/m0-independent-report.json
          AFTER="$(git status --porcelain)"
          test "${BEFORE}" = "${AFTER}"
          {
            echo "## M0 independent preimplementation verification"
            echo
            echo "- Subject: \`${TARGET_SHA}\`"
            echo "- Result: **PASS**"
            echo "- Remediation performed: **false**"
            echo "- M0 final Gate created: **false**"
            echo "- Scope base: \`${PHASE1_SCOPE_BASE}\`"
            echo "- Scope branch: \`${PHASE1_SCOPE_BRANCH}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
