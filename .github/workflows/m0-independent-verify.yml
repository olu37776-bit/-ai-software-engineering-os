name: M0 independent preimplementation verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact protected-main merge commit to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: m0-independent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  required-quality:
    uses: ./.github/workflows/quality.yml
    with:
      target_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }}

  required-packaging:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact packaging subject
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0
      - name: Install exact Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          check-latest: false
      - name: Activate exact pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.24.0
      - name: Build and qualify immutable artifact
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec vitest run --config tests/qualification/packaging/vitest.config.mjs
          node scripts/toolchain/qualify-required-packaging.mjs
      - name: Preserve exact-subject packaging Evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: required-p1-v09-packaging-evidence
          path: ${{ runner.temp }}/required-packaging/p1-v09-packaging.json
          if-no-files-found: error
          retention-days: 90

  verify:
    if: always()
    needs: [required-quality, required-packaging]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require every qualification before accepting the subject
        env:
          QUALITY_RESULT: ${{ needs.required-quality.result }}
          PACKAGING_RESULT: ${{ needs.required-packaging.result }}
        run: |
          test "$QUALITY_RESULT" = "success"
          test "$PACKAGING_RESULT" = "success"

      - name: Clone immutable subject
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git checkout --detach "${TARGET_SHA}"

      - name: Clone protected-main dispatch controller
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CONTROL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git clone "https://github.com/${GITHUB_REPOSITORY}.git" controller
          cd controller
          git checkout --detach "${CONTROL_SHA}"

      - name: Install exact Node.js for scope authority
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.19.0
          check-latest: false

      - name: Resolve exact event scope bindings
        if: ${{ github.event_name != 'workflow_dispatch' }}
        working-directory: repo
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/toolchain/resolve-scope-event.mjs >> "${GITHUB_ENV}"

      - name: Resolve exact protected-main qualification target
        if: ${{ github.event_name == 'workflow_dispatch' }}
        working-directory: repo
        env:
          POST_MERGE_TARGET_SHA: ${{ inputs.target_sha }}
          POST_MERGE_CURRENT_MAIN_SHA: ${{ github.sha }}
          POST_MERGE_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node ../controller/scripts/toolchain/resolve-post-merge-target.mjs >> "${GITHUB_ENV}"
          rm -rf ../controller

      - name: Install pinned independent verifier
        working-directory: repo
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input \
            "jsonschema==4.25.1" \
            "referencing==0.36.2"

      - name: Run read-only verification
        working-directory: repo
        env:
          TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.target_sha || github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          BEFORE="$(git status --porcelain)"
          SCOPE_REPORT="/tmp/phase1-operation-scope-report.json"
          node scripts/toolchain/verify-scope.mjs > "${SCOPE_REPORT}"
          node -e '
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (report.result !== "PASS") process.exit(1);
          ' "${SCOPE_REPORT}"
          python scripts/governance/verify_m0.py \
            --base "${PHASE1_SCOPE_BASE}" \
            --head "${PHASE1_SCOPE_HEAD}" \
            --branch "${PHASE1_SCOPE_BRANCH}" \
            --scope-report "${SCOPE_REPORT}" \
            --subject "${TARGET_SHA}" \
            | tee /tmp/m0-independent-report.json
          AFTER="$(git status --porcelain)"
          test "${BEFORE}" = "${AFTER}"
          {
            echo "## M0 independent preimplementation verification"
            echo
            echo "- Subject: \`${TARGET_SHA}\`"
            echo "- Result: **PASS**"
            echo "- Remediation performed: **false**"
            echo "- M0 final Gate created: **false**"
            echo "- Scope base: \`${PHASE1_SCOPE_BASE}\`"
            echo "- Scope branch: \`${PHASE1_SCOPE_BRANCH}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
